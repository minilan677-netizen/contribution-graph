name: Daily Contribution

on:
  schedule:
    - cron: '0 0 * * *'  # Every day at 00:00 UTC
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update activity log
        run: |
          echo "Activity on $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> activity.log
      - name: Commit and push
        run: |
          git config user.name "minilan677-netizen"
          git config user.email "321019851+minilan677-netizen@users.noreply.github.com"
          git add activity.log
          git commit -m "chore: daily activity $(date -u +%Y-%m-%d)" || exit 0
          git push
